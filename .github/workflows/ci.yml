name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "20", cache: "npm" }
      # throng-agent-claude depends on @col/a2a-claude from GitHub Packages. The
      # committed .npmrc reads its auth token from $GITHUB_TOKEN, and GitHub
      # Packages requires auth for every npm download, even of a public package.
      # The package is public, so the workflow's own token (with the
      # `packages: read` permission above) is enough; the PACKAGES_TOKEN PAT this
      # used to rely on had expired and failed every run since 2026-11-14.
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      # The Dockerfile installs /usr/local/bin/throng-creds and /usr/local/bin/gh
      # from packages/core/dist/creds. Nothing but the `cp && chmod` tail of
      # core's build script puts them there, and tsc ignores .sh files entirely —
      # so losing that line breaks the image while leaving build, typecheck and
      # test green. This is the only place that notices, and it costs nothing.
      - name: Verify the creds scripts shipped in dist
        run: |
          for f in packages/core/dist/creds/throng-creds.sh packages/core/dist/creds/gh-shim.sh; do
            [ -f "$f" ] || { echo "::error::$f is missing from the build output"; exit 1; }
            [ -x "$f" ] || { echo "::error::$f is not executable"; exit 1; }
          done
      - run: npm run typecheck
      - run: npm test
